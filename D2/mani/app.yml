apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shopping-app-prod-agcd
  namespace: prod
spec:
  project: argo-demo
  source:
    repoURL: https://github.com/gg-alva/gops.git
    targetRevision: main
    path: D2/mani
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

